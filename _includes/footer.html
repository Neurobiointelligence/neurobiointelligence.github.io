<head>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    footer {
      background-color: #f8f8f8;
      color: #333;
      font-family: 'Source Sans Pro', sans-serif;
      border-top: 1px solid #ddd;
    }
    .footer-logos {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 28px 40px 16px;
      border-bottom: 1px solid #ddd;
      background-color: #ffffff;
    }
    .footer-logos img {

      width: auto;
      object-fit: contain;
      filter: grayscale(20%);
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .footer-logos img:hover {
      opacity: 1;
    }
    .footer-info {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 20px 40px;
    }
    .footer-lab-name {
      font-size: 1.0rem;
      font-weight: 700;
      color: #222;
      white-space: nowrap;
    }
    .footer-address {
      font-size: 0.85rem;
      color: #555;
      line-height: 1.7;
      text-align: center;
    }
    .footer-copyright {
      background-color: #242424;
      color: #ccc;
      text-align: center;
      font-size: 0.82rem;
      padding: 10px;
    }

<footer>
  <div class="footer-logos">
    <img src="/images/footer/GIST_Dept_LifeSciences.png" alt="GIST Department of Life Sciences">

    <img src="/images/footer/융합신경생리학과.jpg" alt="융합신경생리학과" style="height: 32px;">

  <div class="footer-info">
    <div class="footer-lab-name">
      NBI-Lab (KJung Lab for Neurobiological Intelligence)
    </div>
    <div class="footer-address">
      Department of Life Sciences 218-219, Gwangju Institute of Science and Technology (GIST)<br>
      123 Cheomdangwagi-ro, Buk-gu, Gwangju 61005, Republic of Korea
    </div>
